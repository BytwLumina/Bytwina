name: native-client
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: native-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # `cargo xtask check` runs fmt, clippy, the workspace tests, the no-default-features
  # check and the policy gate in sequence, and every one of them compiles the whole
  # dependency graph again under a different feature set. Running them as separate jobs
  # lets the runners work in parallel. The shared sccache backend can reuse compatible
  # compilation outputs across jobs and runs; cold or concurrent builds can still miss.
  lint:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      # sccache stores cacheable compilations in the Actions cache for later runs.
      - uses: mozilla-actions/sccache-action@v0.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Registry data is cached here; compatible compiler outputs use sccache.
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      # The policy gate reads Cargo.lock and the desktop persistence controls.
      - run: cargo xtask policy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: mozilla-actions/sccache-action@v0.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked
  demo:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: mozilla-actions/sccache-action@v0.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      # `cargo xtask check` already runs `check -p bytwina --no-default-features`, so the
      # demo feature is the only combination it does not cover.
      - name: Check and test demo targets
        run: |
          cargo check --locked -p bytwina -p ui --all-targets --features bytwina/demo
          cargo test --locked -p bytwina -p ui -p client-core -p discord-api --features bytwina/demo --lib --bins typing
  nodepfault:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: mozilla-actions/sccache-action@v0.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - run: cargo check --locked -p bytwina --no-default-features
  offline:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: mozilla-actions/sccache-action@v0.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Parallel actions both open the runner event file; Windows can fail on the shared lock.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libvulkan-dev libasound2-dev libpulse-dev cmake python3 dpkg-dev desktop-file-utils xvfb xauth
      - run: cargo fetch --locked
      # The workspace test drives the cached xtask binary, so it has to exist first.
      - run: cargo build --locked -p xtask
      - name: Mac signing regression (offline)
        if: runner.os != 'Windows'
        run: bash packaging/macos/test_sign_release.sh
      - parallel:
          - name: Flatpak encoding after GTK initialization (synthetic)
            if: runner.os == 'Linux'
            run: xvfb-run -a cargo test --locked -p platform --features winit/x11,winit/wayland --lib flatpak_locale_tests::post_gtk_flatpak_encoding_preflight -- --exact --ignored
          - run: bun tests/login-handoff.cjs
          - run: bun tests/xtask-workspace.cjs
          - name: Linux package regression
            if: runner.os == 'Linux'
            run: PYTHONDONTWRITEBYTECODE=1 python3 packaging/linux/test_package.py
  package:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    # CI only proves the package builds; the shipped binary keeps the fat-LTO profile
    # from Cargo.toml. Thin LTO with parallel codegen units is several times faster.
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Preserve cache statistics through the long final link.
      SCCACHE_IDLE_TIMEOUT: "5400"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: mozilla-actions/sccache-action@v0.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Package app without demo or developer features
        run: cargo xtask package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bytwina-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: dist/
  # Keeps the required-check name stable: it reports the aggregate of every gate, so a
  # branch rule on "native" now waits for all of them instead of one sequential job.
  native:
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: [lint, test, demo, nodepfault, offline, package]
    runs-on: windows-latest
    steps:
      - name: Fail if any gate failed
        shell: bash
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          DEMO: ${{ needs.demo.result }}
          NODEFAULT: ${{ needs.nodepfault.result }}
          OFFLINE: ${{ needs.offline.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          failed=""
          for gate in LINT TEST DEMO NODEFAULT OFFLINE PACKAGE; do
            value="${!gate}"
            if [ "$value" != "success" ]; then
              failed="$failed $gate=$value"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed gates:$failed"
            exit 1
          fi
          echo "All gates passed."
  extension-sdk:
    # Paused while the pipeline targets Windows only.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            examples/extensions -> target
            extensions -> target
      # The root, examples/extensions and extensions workspaces have separate target directories.
      - parallel:
          - name: Validate catalog packages, manifests and previews (offline)
            run: |
              PYTHONDONTWRITEBYTECODE=1 python3 extensions/test_catalog.py
              python3 extensions/catalog.py --validate
          - run: cargo fmt --manifest-path examples/extensions/Cargo.toml --all -- --check
          - run: cargo fmt --manifest-path extensions/Cargo.toml --all -- --check
      - parallel:
          - run: cargo test --manifest-path examples/extensions/Cargo.toml --workspace --locked
          - run: cargo test --manifest-path extensions/Cargo.toml --workspace --locked
          - run: cargo test --locked -p extensions --test app_contract --example manifest_check
      - parallel:
          - run: cargo clippy --manifest-path examples/extensions/Cargo.toml --workspace --all-targets --locked -- -D warnings
          - run: cargo clippy --manifest-path extensions/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - parallel:
          - run: cargo build --manifest-path examples/extensions/Cargo.toml --workspace --locked --release --target wasm32-unknown-unknown
          - run: cargo build --manifest-path extensions/Cargo.toml --workspace --locked --release --target wasm32-unknown-unknown
      - name: Check existing and rebuilt plugins in the host sandbox (offline)
        run: cargo run --locked --release -p extensions --example sdk_check -- examples/extensions/target/wasm32-unknown-unknown/release extensions/target/wasm32-unknown-unknown/release
      - run: cargo run --locked --release -p extensions --example legacy_sdk_check
  security:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-audit-0.22.2
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --deny warnings
  fuzz:
    # Paused while the pipeline targets Windows only.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-fuzz-0.13.2
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            fuzz -> target
      - parallel:
          - run: rustup toolchain install nightly-2026-09-09 --profile minimal
          - run: cargo install cargo-fuzz --version 0.13.2 --locked
          - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
          - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo xtask fuzz
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: synthetic-fuzz-failures
          path: target/fuzz-smoke/*.crash
          if-no-files-found: ignore
          retention-days: 7
